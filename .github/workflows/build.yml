name: Build APK

# Every push builds the APK. On main it is also published as a GitHub release
# (tag v<run number>), which Obtainium can watch for updates.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ubuntu-latest already has the Android SDK (ANDROID_HOME); Gradle fetches platform 36 if needed.

      - run: npm ci
      - run: npx cap sync android

      - name: Decode signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: building a debug-signed APK. Its key changes between runs, so it won't install over a previous build. See README."
          fi

      - name: Build
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/TimeTracker.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/TimeTracker.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TimeTracker-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/TimeTracker.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main' && steps.key.outputs.file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "$RUNNER_TEMP/TimeTracker.apk" \
            --title "$VERSION_NAME" --notes "Built from ${GITHUB_SHA::7}." --target "$GITHUB_SHA"
